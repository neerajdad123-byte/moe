<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Decode speed: moex 67.8 tokens/s vs ik_llama.cpp 36.0 and llama.cpp 33.3 tokens/s</title>
  <desc id="d">Qwen3.6-35B-A3B on an RTX 4050 Laptop 6 GB, 1K-token prompts. moex with multi-token prediction is 1.9 times faster than the fastest tuned llama engine without speculative decoding.</desc>
  <style>
    .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .grid { stroke: #e4e3df; } .base { stroke: #b9b8b2; }
    .moex { fill: #2a78d6; } .llama { fill: #b9b8b2; } .pill { fill: #2a78d6; } .pillt { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #f0f0ee; } .t2 { fill: #a9a89f; } .grid { stroke: #30302e; } .base { stroke: #5d5c58; }
      .moex { fill: #3987e5; } .llama { fill: #6b6a65; } .pill { fill: #3987e5; }
    }
  </style>
  <text x="0" y="22" class="t1" font-size="17" font-weight="600">Decode speed on a 6 GB laptop GPU</text>
  <text x="0" y="44" class="t2" font-size="13">tokens per second, higher is better · Qwen3.6-35B-A3B · 1K-token prompts</text>

  <!-- grid: x = 190 + 7 px per tok/s -->
  <g class="grid" stroke-width="1">
    <line x1="260" y1="66" x2="260" y2="230"/><line x1="330" y1="66" x2="330" y2="230"/>
    <line x1="400" y1="66" x2="400" y2="230"/><line x1="470" y1="66" x2="470" y2="230"/>
    <line x1="540" y1="66" x2="540" y2="230"/><line x1="610" y1="66" x2="610" y2="230"/>
    <line x1="680" y1="66" x2="680" y2="230"/>
  </g>
  <line x1="190" y1="66" x2="190" y2="230" class="base" stroke-width="1"/>
  <g class="t2" font-size="11" text-anchor="middle">
    <text x="190" y="246">0</text><text x="260" y="246">10</text><text x="330" y="246">20</text>
    <text x="400" y="246">30</text><text x="470" y="246">40</text><text x="540" y="246">50</text>
    <text x="610" y="246">60</text><text x="680" y="246">70</text>
  </g>

  <!-- moex 67.8 -->
  <text x="176" y="96" class="t1" font-size="15" font-weight="600" text-anchor="end">moex</text>
  <text x="176" y="112" class="t2" font-size="11" text-anchor="end">default · with MTP</text>
  <path class="moex" d="M190 78 H661 Q665 78 665 82 V110 Q665 114 661 114 H190 Z"/>
  <text x="675" y="102" class="t1" font-size="15" font-weight="700">67.8</text>

  <!-- ik_llama.cpp 36.0 -->
  <text x="176" y="148" class="t1" font-size="15" text-anchor="end">ik_llama.cpp</text>
  <text x="176" y="164" class="t2" font-size="11" text-anchor="end">hand-tuned · no spec. decoding</text>
  <path class="llama" d="M190 130 H438 Q442 130 442 134 V162 Q442 166 438 166 H190 Z"/>
  <text x="452" y="154" class="t1" font-size="15">36.0</text>

  <!-- llama.cpp 33.3 -->
  <text x="176" y="200" class="t1" font-size="15" text-anchor="end">llama.cpp</text>
  <text x="176" y="216" class="t2" font-size="11" text-anchor="end">hand-tuned · no spec. decoding</text>
  <path class="llama" d="M190 182 H419 Q423 182 423 186 V214 Q423 218 419 218 H190 Z"/>
  <text x="433" y="206" class="t1" font-size="15">33.3</text>

  <!-- callout -->
  <rect x="510" y="134" width="116" height="28" rx="14" class="pill"/>
  <text x="568" y="153" class="pillt" font-size="14" font-weight="700" text-anchor="middle">1.9× faster</text>

  <text x="0" y="276" class="t2" font-size="11">RTX 4050 Laptop 6 GB · i7-13650HX · 24 GB RAM · 128 tokens, greedy · llama.cpp b11756 / ik_llama.cpp 565f08d1, Q4_K_M</text>
</svg>
