<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Decode speed: moex 46.2 tokens/s vs llama.cpp 20.3 tokens/s</title>
  <desc id="d">Qwen3.6-35B-A3B on an RTX 4050 Laptop 6 GB. moex is 2.3 times faster than llama.cpp at default settings.</desc>
  <style>
    .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .grid { stroke: #e4e3df; } .base { stroke: #b9b8b2; }
    .moex { fill: #2a78d6; } .llama { fill: #b9b8b2; } .pill { fill: #2a78d6; } .pillt { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #f0f0ee; } .t2 { fill: #a9a89f; } .grid { stroke: #30302e; } .base { stroke: #5d5c58; }
      .moex { fill: #3987e5; } .llama { fill: #6b6a65; } .pill { fill: #3987e5; }
    }
  </style>
  <text x="0" y="22" class="t1" font-size="17" font-weight="600">Decode speed on a 6 GB laptop GPU</text>
  <text x="0" y="44" class="t2" font-size="13">tokens per second, higher is better · Qwen3.6-35B-A3B</text>

  <!-- grid: x = 190 + 10 px per tok/s -->
  <g class="grid" stroke-width="1">
    <line x1="290" y1="66" x2="290" y2="178"/><line x1="390" y1="66" x2="390" y2="178"/>
    <line x1="490" y1="66" x2="490" y2="178"/><line x1="590" y1="66" x2="590" y2="178"/>
    <line x1="690" y1="66" x2="690" y2="178"/>
  </g>
  <line x1="190" y1="66" x2="190" y2="178" class="base" stroke-width="1"/>
  <g class="t2" font-size="11" text-anchor="middle">
    <text x="190" y="194">0</text><text x="290" y="194">10</text><text x="390" y="194">20</text>
    <text x="490" y="194">30</text><text x="590" y="194">40</text><text x="690" y="194">50</text>
  </g>

  <!-- moex 46.2 -->
  <text x="176" y="96" class="t1" font-size="15" font-weight="600" text-anchor="end">moex</text>
  <text x="176" y="112" class="t2" font-size="11" text-anchor="end">average · up to 53</text>
  <path class="moex" d="M190 78 H648 Q652 78 652 82 V110 Q652 114 648 114 H190 Z"/>
  <text x="662" y="102" class="t1" font-size="15" font-weight="700">46.2</text>

  <!-- llama.cpp 20.3 -->
  <text x="176" y="148" class="t1" font-size="15" text-anchor="end">llama.cpp</text>
  <text x="176" y="164" class="t2" font-size="11" text-anchor="end">default settings</text>
  <path class="llama" d="M190 130 H389 Q393 130 393 134 V162 Q393 166 389 166 H190 Z"/>
  <text x="403" y="154" class="t1" font-size="15">20.3</text>

  <!-- callout -->
  <rect x="452" y="134" width="116" height="28" rx="14" class="pill"/>
  <text x="510" y="153" class="pillt" font-size="14" font-weight="700" text-anchor="middle">2.3× faster</text>

  <text x="0" y="222" class="t2" font-size="11">RTX 4050 Laptop 6 GB · i7-13650HX · 24 GB RAM · 10 unseen prompts, 128 tokens each, greedy · llama.cpp b11563, Q4_K_M</text>
</svg>
