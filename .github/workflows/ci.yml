# Builds the release moex.exe (same flags as build.bat) and checks the tokenizer against Hugging Face's.
# No GPU on GitHub runners: test_kernels, --check and the server tests stay local (see README, Building from source).
name: CI
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one zip failing must not cancel the other
      matrix:
        include:  # CUDA 13 needs driver 580+; the CUDA 12 build runs on older drivers
          # crt, nvvm and nvptxcompiler are separate installer packages only from CUDA 13 (inside nvcc in 12.x).
          # CUDA 12.8's cudafe++ crashes on the VS 2026 headers of windows-2025: it builds with VS 2022 (supported).
          # nvtx: the header-only NVTX (profiler ranges in moex.cu)
          - { os: windows-2025, cuda: 13.3.0, zip: moex-windows-x64, nvflags: '', pkgs: '["nvcc", "cudart", "crt", "nvvm", "nvptxcompiler", "nvtx"]' }
          - { os: windows-2022, cuda: 12.8.1, zip: moex-windows-x64-cuda12, nvflags: '', pkgs: '["nvcc", "cudart", "nvtx"]' }
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: ${{ matrix.pkgs }}

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build moex.exe (RTX 20-50, A100, H100 + PTX)
        shell: cmd
        run: |
          mkdir build
          nvcc -std=c++20 -O3 -lineinfo ${{ matrix.nvflags }} -Xcompiler "/EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS /arch:AVX2" ^
            -gencode arch=compute_75,code=sm_75 -gencode arch=compute_80,code=sm_80 -gencode arch=compute_86,code=sm_86 ^
            -gencode arch=compute_89,code=sm_89 -gencode arch=compute_90,code=sm_90 -gencode arch=compute_120,code=sm_120 ^
            -gencode arch=compute_120,code=compute_120 -Xlinker /MANIFEST:EMBED -Xlinker /MANIFESTINPUT:src\moex.manifest ^
            src\moex.cu -o build\moex.exe

      - name: moex --version
        run: build\moex.exe --version

      - name: Version matches the tag (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$(build/moex.exe --version)" = "moex ${GITHUB_REF_NAME#v}"

      - name: Command line without a GPU or model (help, bad input, missing model)
        shell: bash
        run: |
          set +e  # outputs are captured whole (grep -q under pipefail would fail on the closed pipe), each check prints
          out=$(build/moex.exe help 2>&1); rc=$?; echo "help: rc $rc"; [ $rc -eq 0 ] && [[ "$out" == *"moex download"* ]] || { echo "$out"; exit 1; }
          build/moex.exe > /dev/null 2>&1; rc=$?; echo "no arguments: rc $rc"; [ $rc -eq 2 ] || exit 1
          build/moex.exe nosuchcommand > /dev/null 2>&1; rc=$?; echo "unknown command: rc $rc"; [ $rc -eq 2 ] || exit 1
          out=$(build/moex.exe chat --model no_model_here 2>&1); rc=$?; echo "missing model: rc $rc | $out"; [ $rc -eq 1 ] && [[ "$out" == *"No model at"* ]] || exit 1
          out=$(build/moex.exe chat --model some.gguf 2>&1); rc=$?; echo "GGUF as --model: rc $rc"; [ $rc -eq 1 ] && [[ "$out" == *"moex import"* ]] || { echo "$out"; exit 1; }
          build/moex.exe import > /dev/null 2>&1; rc=$?; echo "import without a file: rc $rc"; [ $rc -eq 2 ] || exit 1
          out=$(build/moex.exe import no_such.gguf 2>&1); rc=$?; echo "import of a missing file: rc $rc | $out"; [ $rc -eq 1 ] && [[ "$out" == *"cannot open"* ]] || exit 1

      - name: Download and PATH helpers (no GPU, no internet)
        shell: cmd
        run: |
          nvcc -std=c++20 -O3 -Xcompiler "/EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS" tests\test_download.cu -o build\test_download.exe -ladvapi32 -luser32 || exit /b 1
          nvcc -std=c++20 -O3 -Xcompiler "/EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS" tests\test_userenv.cu -o build\test_userenv.exe -ladvapi32 -luser32 || exit /b 1
          build\test_download.exe || exit /b 1
          build\test_userenv.exe || exit /b 1

      - name: Zip (same contents as package.bat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\moex | Out-Null
          Copy-Item build\moex.exe, README.md, LICENSE, data\moex_hot.bin dist\moex\
          Compress-Archive dist\moex\* dist\${{ matrix.zip }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}.zip

      - name: Build test_tokenizer.exe
        shell: cmd
        run: cl /nologo /std:c++20 /O2 /EHsc /utf-8 tests\test_tokenizer.cpp /Fe:build\test_tokenizer.exe /Fo:build\

      - name: GGUF reader (dequantization vs llama.cpp's reference, header, value-head order, int4 requantizer)
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS tests\test_gguf.cpp /Fe:build\test_gguf.exe /Fo:build\ || exit /b 1
          build\test_gguf.exe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tokenizer vs Hugging Face
        shell: bash
        run: |
          pip install tokenizers
          mkdir -p tok
          curl -sSfL -o tok/tokenizer.json https://huggingface.co/Kreuzzelg/qwen36-35b-a3b-colibri-i4-gs64/resolve/main/tokenizer.json
          QWEN36_MODEL=tok python tools/check_tokenizer.py

      - name: Build test_template.exe
        shell: cmd
        run: cl /nologo /std:c++20 /O2 /EHsc /utf-8 /D_CRT_SECURE_NO_WARNINGS tests\test_template.cpp /Fe:build\test_template.exe /Fo:build\

      - name: Chat prompts vs Qwen3.6's chat template (offline, no model)
        shell: bash
        run: |
          pip install jinja2
          QWEN36_MODEL=tok python tools/check_template.py --offline tok

  linux:
    # NVIDIA's CUDA images on Ubuntu 22.04 (glibc 2.35): the binary also runs on newer distributions.
    # CUDA 13 needs driver 580+; the CUDA 12 build runs on older drivers (as on Windows).
    runs-on: ubuntu-latest
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: 13.3.0, tar: moex-linux-x64 }
          - { cuda: 12.8.1, tar: moex-linux-x64-cuda12 }
    steps:
      - name: Tools (git, curl, python)
        run: apt-get update -qq && apt-get install -y -qq git curl python3-pip > /dev/null

      - uses: actions/checkout@v4

      - name: Build moex and the test programs (./build.sh)
        run: ./build.sh

      - name: Version matches the tag (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(build/moex --version)" = "moex ${GITHUB_REF_NAME#v}"

      - name: Checks without a GPU or model (tools/test_linux.sh cpu)
        run: |
          pip install -q tokenizers jinja2
          NOBUILD=1 PY=python3 tools/test_linux.sh cpu

      - name: Tarball (moex, moex_hot.bin, README, LICENSE)
        run: |
          mkdir -p dist/moex
          cp build/moex data/moex_hot.bin README.md LICENSE dist/moex/
          tar -czf dist/${{ matrix.tar }}.tar.gz -C dist moex

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tar }}
          path: dist/${{ matrix.tar }}.tar.gz
