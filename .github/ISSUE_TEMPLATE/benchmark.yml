name: Benchmark report
description: Share your `moex bench` result, so the tested machines table grows
title: "Bench: <your GPU>, <MTP on> tok/s"
labels: [benchmark]
body:
  - type: textarea
    id: line
    attributes:
      label: The line from `moex bench`
      description: Run `moex bench` (plugged in, nothing else running) and paste the line it tells you to share.
      placeholder: moex 0.2.0 | NVIDIA GeForce RTX 4050 Laptop GPU 6 GB, driver 610.74 | 13th Gen Intel(R) Core(TM) i7-13650HX, 20 threads | RAM 25 GB | 2007 slots | MTP off 60.1, MTP on 71.5, MTP on + --fast 74.6 tok/s
      render: text
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Laptop or desktop model
      placeholder: e.g. Lenovo Legion 5 (2023), or a desktop
  - type: dropdown
    id: power
    attributes:
      label: Plugged in, and power mode
      options:
        - Plugged in, Best performance / performance mode
        - Plugged in, Balanced
        - On battery
        - Desktop
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Other apps open, driver version, anything odd you saw.
